ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.corise.dnd.ApplicationKt.module ]
    }
}

db {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = ${JWT_ISSUER}
    audience = ${JWT_AUDIENCE}
    expiresMinutes = 60
    expiresMinutes = ${?JWT_EXPIRES_MINUTES}
}
