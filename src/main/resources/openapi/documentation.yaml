        '401': *id002
        '404': *id006
    put:
      summary: 'Изменить собственный элемент: Культуры'
      tags:
        - Культуры
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedUpdateRequest'
      responses:
        '200':
          description: Изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedResponse'
        '401': *id002
        '403': *id007
        '404': *id006
        '409': *id003
        '422': *id004
    delete:
      summary: 'Удалить собственный элемент: Культуры'
      tags:
        - Культуры
      security: *id001
      responses:
        '204':
          description: Удалено
        '401': *id002
        '403': *id007
        '404': *id006
        '409': *id003
  /api/v1/religions/{id}:
    parameters:
      - *id008
    get:
      summary: 'По id: Религии'
      tags:
        - Религии
      security: *id001
      responses:
        '200':
