          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassResponse'
        '401': *id002
    post:
      summary: 'Создать пользовательский элемент: Классы'
      tags:
        - Классы
      security: *id001
      requestBody:
        required: true
