openapi: 3.0.3
info:
  title: CoriseDND API
  version: 1.0.0
  description: API конструктора персонажей CoriseDND. Маршруты версионированы (/api/v1). Стандартный контент виден всем и доступен только для чтения; пользовательский виден и изменяем только автором.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/register:
    post:
      summary: Регистрация
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email или имя пользователя уже заняты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      summary: Вход
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me:
    get:
      summary: Текущий пользователь
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Токен отсутствует, недействителен или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/races:
    get:
      summary: 'Список: Расы (стандартные и собственные)'
      tags:
        - Расы
      security: &id001
        - bearerAuth: []
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RaceResponse'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: 'Создать пользовательский элемент: Расы'
      tags:
        - Расы
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaceCreateRequest'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaceResponse'
        '401': *id002
        '409': &id003
          description: 'Конфликт: запись используется персонажами или имя уже занято'
          content:
            application/json:
              schema: &id005
                $ref: '#/components/schemas/ErrorResponse'
        '422': &id004
          $ref: '#/components/responses/ValidationError'
  /api/v1/cultures:
    get:
      summary: 'Список: Культуры (стандартные и собственные)'
      tags:
        - Культуры
      security: *id001
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamedResponse'
        '401': *id002
    post:
      summary: 'Создать пользовательский элемент: Культуры'
      tags:
        - Культуры
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedCreateRequest'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedResponse'
        '401': *id002
        '409': *id003
        '422': *id004
  /api/v1/religions:
    get:
      summary: 'Список: Религии (стандартные и собственные)'
      tags:
        - Религии
      security: *id001
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamedResponse'
        '401': *id002
    post:
      summary: 'Создать пользовательский элемент: Религии'
      tags:
        - Религии
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedCreateRequest'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedResponse'
        '401': *id002
        '409': *id003
        '422': *id004
  /api/v1/backstories:
    get:
      summary: 'Список: Предыстории (стандартные и собственные)'
      tags:
        - Предыстории
      security: *id001
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamedResponse'
        '401': *id002
    post:
      summary: 'Создать пользовательский элемент: Предыстории'
      tags:
        - Предыстории
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedCreateRequest'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedResponse'
        '401': *id002
        '409': *id003
        '422': *id004
  /api/v1/spells:
    get:
      summary: Заклинания (поиск, фильтр по типу, подгрузка частями)
      tags:
        - Заклинания
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Подстрока в названии
        - name: type
          in: query
          schema:
            type: string
          description: Точный тип заклинания
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница заклинаний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpellPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: 'Создать пользовательский элемент: Заклинания'
      tags:
        - Заклинания
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpellCreateRequest'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpellResponse'
        '401': *id002
        '409': *id003
        '422': *id004
  /api/v1/characters:
    get:
      summary: Мои персонажи (поиск, фильтр, сортировка, подгрузка частями)
      tags:
        - Characters
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Подстрока в имени
        - name: raceId
          in: query
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - level
              - id
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница персонажей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Создать персонажа (вместе с заклинаниями, в одной транзакции)
      tags:
        - Characters
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterCreateRequest'
      responses:
        '201':
          description: Персонаж создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/characters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Персонаж по id
      tags:
        - Characters
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Персонаж
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Изменить персонажа
      tags:
        - Characters
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterUpdateRequest'
      responses:
        '200':
          description: Персонаж изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Удалить персонажа
      tags:
        - Characters
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/characters/{id}/spells:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Добавить заклинание персонажу
      tags:
        - Characters
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSpellRequest'
      responses:
        '201':
          description: Заклинание добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заклинание уже есть у персонажа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/characters/{id}/spells/{spellId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: spellId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      summary: Убрать заклинание у персонажа
      tags:
        - Characters
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Заклинание убрано
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/races/{id}:
    parameters:
      - &id008
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: 'По id: Расы'
      tags:
        - Расы
      security: *id001
      responses:
        '200':
          description: Элемент
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaceResponse'
        '401': *id002
        '404': &id006
          description: Не найдено (или чужой пользовательский контент)
          content:
            application/json:
              schema: *id005
    put:
      summary: 'Изменить собственный элемент: Расы'
      tags:
        - Расы
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaceUpdateRequest'
      responses:
        '200':
          description: Изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaceResponse'
        '401': *id002
        '403': &id007
          description: Стандартный контент нельзя изменять или удалять
          content:
            application/json:
              schema: *id005
        '404': *id006
        '409': *id003
        '422': *id004
    delete:
      summary: 'Удалить собственный элемент: Расы'
      tags:
        - Расы
      security: *id001
      responses:
        '204':
          description: Удалено
        '401': *id002
        '403': *id007
        '404': *id006
        '409': *id003
  /api/v1/cultures/{id}:
    parameters:
      - *id008
    get:
      summary: 'По id: Культуры'
      tags:
