        - Оружие
      security: *id001
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeaponResponse'
        '401': *id002
    post:
      summary: 'Создать пользовательский элемент: Оружие'
      tags:
