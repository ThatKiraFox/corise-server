components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
  responses:
    Unauthorized:
      description: Токен отсутствует, недействителен или истёк
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Запись принадлежит другому пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
        - confirmPassword
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 72
        confirmPassword:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserResponse:
      type: object
      required:
        - id
        - email
        - username
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        username:
          type: string
    AuthResponse:
      type: object
      required:
        - token
        - tokenType
        - expiresInSeconds
        - user
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserResponse'
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
    NamedRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    RaceResponse:
      type: object
      required:
        - id
        - outName
        - inName
        - shortDesc
        - appearance
        - lore
        - relationships
        - status
        - archetype
        - isCustom
      properties:
        id: &id012
          type: integer
          format: int64
        outName: &id011
          type: string
        inName: *id011
        shortDesc: *id011
        appearance: *id011
        lore: *id011
        relationships: *id011
        status: *id011
        archetype: *id011
        lifespan:
          type: integer
          nullable: true
        isCustom: &id013
          type: boolean
    NamedResponse:
      type: object
      required:
        - id
        - name
        - description
        - isCustom
      properties:
        id: *id012
        name: *id011
        description: *id011
        isCustom: *id013
    SpellResponse:
      type: object
      required:
        - id
        - name
        - time
        - type
        - distance
        - effect
        - cost
        - description
        - isCustom
      properties:
        id: *id012
        name: *id011
        time: *id011
        type: *id011
        distance: &id014
          type: integer
        effect: *id011
        cost: *id014
        description: *id011
        isCustom: *id013
    SpellPage:
